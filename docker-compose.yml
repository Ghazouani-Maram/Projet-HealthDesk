# Base PostgreSQL optionnelle pour le développement local.
# Le backend fonctionne aussi sans Docker avec SQLite (voir README-LOCAL.md).
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports: ["5432:5432"]   # développement uniquement : à retirer au déploiement
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:
