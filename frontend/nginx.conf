# Nginx interne au conteneur frontend : sert uniquement les fichiers statiques.
# Le reverse proxy de la VM route /api vers le backend et / vers ce conteneur.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
